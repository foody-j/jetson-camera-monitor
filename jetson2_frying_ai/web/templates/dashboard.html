<!DOCTYPE html>
<html>
<head>
    <title>Jetson2 Dashboard</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h1>Jetson2 Headless Dashboard</h1>
        <div id="status-bar">Loading...</div>
    </div>

    <div class="control-panel">
        <div class="control-group">
            <div class="control-title">Relay</div>
            <button class="btn" onclick="relayControl('on')">ON</button>
            <button class="btn" onclick="relayControl('off')">OFF</button>
        </div>
        <div class="control-group">
            <div class="control-title">Vibration</div>
            <button class="btn" onclick="vibrationControl('start')">START</button>
            <button class="btn" onclick="vibrationControl('stop')">STOP</button>
            <button class="btn" onclick="vibrationStatus('NORMAL')">NORMAL</button>
            <button class="btn" onclick="vibrationStatus('ABNORMAL')">ABNORMAL</button>
            <button class="btn" onclick="vibrationStatus('IDLE')">IDLE</button>
        </div>
        <div class="control-group">
            <div class="control-title">Observe</div>
            <button class="btn" onclick="observeControl('left','FILLED')">L FILLED</button>
            <button class="btn" onclick="observeControl('left','EMPTY')">L EMPTY</button>
            <button class="btn" onclick="observeControl('right','FILLED')">R FILLED</button>
            <button class="btn" onclick="observeControl('right','EMPTY')">R EMPTY</button>
        </div>
        <div class="control-group">
            <div class="control-title">Collect</div>
            <button class="btn" onclick="collectionControl('pot1','start')">P1 START</button>
            <button class="btn" onclick="collectionControl('pot1','stop')">P1 STOP</button>
            <button class="btn" onclick="collectionControl('pot2','start')">P2 START</button>
            <button class="btn" onclick="collectionControl('pot2','stop')">P2 STOP</button>
            <button class="btn" onclick="collectionControl('legacy','start')">ALL START</button>
            <button class="btn" onclick="collectionControl('legacy','stop')">ALL STOP</button>
        </div>
        <div class="control-group">
            <div class="control-title">MQTT</div>
            <button class="btn" onclick="publishNow()">Publish</button>
            <button class="btn" onclick="toggleMqttLog()">Log</button>
        </div>
        <div class="control-group">
            <div class="control-title">Overlay</div>
            <button class="btn" onclick="overlayControl(true)">ON</button>
            <button class="btn" onclick="overlayControl(false)">OFF</button>
        </div>
    </div>

    <div class="mqtt-log" id="mqtt-log" style="display:none;">
        <div class="mqtt-log-title">MQTT 최근 메시지</div>
        <div class="mqtt-log-list" id="mqtt-log-list">-</div>
    </div>

    <div class="grid">
        <div class="camera-box">
            <div class="cam-header">Frying Left (POT0)</div>
            <img src="/mjpeg/cam0" alt="Frying Left">
            <div class="cam-status" id="status-0">-</div>
        </div>

        <div class="camera-box">
            <div class="cam-header">Frying Right (POT1)</div>
            <img src="/mjpeg/cam1" alt="Frying Right">
            <div class="cam-status" id="status-1">-</div>
        </div>

        <div class="camera-box">
            <div class="cam-header">Bucket Left</div>
            <img src="/mjpeg/cam2" alt="Bucket Left">
            <div class="cam-status" id="status-2">-</div>
        </div>

        <div class="camera-box">
            <div class="cam-header">Bucket Right</div>
            <img src="/mjpeg/cam3" alt="Bucket Right">
            <div class="cam-status" id="status-3">-</div>
        </div>
    </div>

    <script>
        async function postJSON(url, data) {
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data || {})
                });
            } catch (e) {
                console.error('Request failed:', e);
            }
        }

        function relayControl(action) {
            postJSON('/api/control/relay', { action });
        }

        function vibrationControl(action) {
            postJSON('/api/control/vibration', { action });
        }

        function vibrationStatus(status) {
            postJSON('/api/control/vibration/status', { status });
        }

        function observeControl(side, status) {
            postJSON('/api/control/observe', { side, status });
        }

        function collectionControl(target, action) {
            postJSON('/api/control/collection', { target, action });
        }

        function publishNow() {
            postJSON('/api/control/publish', {});
        }

        function overlayControl(enabled) {
            postJSON('/api/control/overlay', { enabled });
        }

        async function toggleMqttLog() {
            const box = document.getElementById('mqtt-log');
            if (box.style.display === 'none') {
                box.style.display = 'block';
                await refreshMqttLog();
            } else {
                box.style.display = 'none';
            }
        }

        async function refreshMqttLog() {
            try {
                const res = await fetch('/api/mqtt/log');
                const data = await res.json();
                const list = document.getElementById('mqtt-log-list');
                list.innerHTML = data.slice(0, 20).map(item => {
                    const payload = (item.payload || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    return `<div class="mqtt-log-item">[${item.timestamp}] <b>${item.topic}</b> ${payload}</div>`;
                }).join('') || '-';
            } catch (e) {
                console.error('MQTT log failed:', e);
            }
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                for (let i = 0; i < 4; i++) {
                    const cam = data.cameras[`cam${i}`];
                    const elem = document.getElementById(`status-${i}`);
                    if (!cam) {
                        elem.textContent = 'Camera disabled';
                        continue;
                    }
                    elem.textContent = `FPS: ${cam.fps} | Frames: ${cam.frame_count} | Drops: ${cam.drop_count}`;
                }

                if (data.frying.pot0) {
                    document.getElementById('status-0').textContent +=
                        ` | Lift: ${data.frying.pot0.lift_count || 0}`;
                }
                if (data.frying.pot1) {
                    document.getElementById('status-1').textContent +=
                        ` | Lift: ${data.frying.pot1.lift_count || 0}`;
                }

                if (data.observe.cam2) {
                    document.getElementById('status-2').textContent +=
                        ` | ${data.observe.cam2.status || 'UNKNOWN'}`;
                }
                if (data.observe.cam3) {
                    document.getElementById('status-3').textContent +=
                        ` | ${data.observe.cam3.status || 'UNKNOWN'}`;
                }

                let header = `MQTT: ${data.mqtt.connected ? 'Connected' : 'Disconnected'} | ` +
                    `Updated: ${new Date(data.timestamp * 1000).toLocaleTimeString()}`;

                if (data.system && data.system.disk) {
                    const disk = data.system.disk;
                    const free = (disk.total_gb - disk.used_gb).toFixed(1);
                    header += ` | Disk: ${disk.used_gb} / ${disk.total_gb} GB (Free ${free} GB)`;
                }

                if (data.collection) {
                    const p1 = data.collection.pot1 ? 'ON' : 'OFF';
                    const p2 = data.collection.pot2 ? 'ON' : 'OFF';
                    const p1f = data.collection.pot1_frames || 0;
                    const p2f = data.collection.pot2_frames || 0;
                    const p1s = data.collection.pot1_session || '-';
                    const p2s = data.collection.pot2_session || '-';
                    document.getElementById('status-0').textContent +=
                        ` | COLLECT:${p1} (${p1f})`;
                    document.getElementById('status-1').textContent +=
                        ` | COLLECT:${p2} (${p2f})`;
                    header += ` | S1:${p1s} S2:${p2s}`;
                }

                document.getElementById('status-bar').textContent = header;

            } catch (e) {
                console.error('Status update failed:', e);
            }
        }

        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
